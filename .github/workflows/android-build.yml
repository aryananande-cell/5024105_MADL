name: Flutter Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: student_app
        run: flutter pub get

      - name: Analyze code
        working-directory: student_app
        run: flutter analyze

      - name: Run tests
        working-directory: student_app
        run: flutter test

      - name: Build release APK
        working-directory: student_app
        run: flutter build apk --release

      - name: Build Android App Bundle
        working-directory: student_app
        run: flutter build appbundle --release

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: student-app-android-release
          path: |
            student_app/build/app/outputs/flutter-apk/app-release.apk
            student_app/build/app/outputs/bundle/release/app-release.aab
